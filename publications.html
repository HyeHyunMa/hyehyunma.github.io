<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications | Hye Hyun Ma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white text-slate-800 leading-relaxed">

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-100">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold tracking-tight text-slate-900">HYE HYUN MA</a>
            <div class="hidden md:flex space-x-8 text-sm font-medium">
                <a href="index.html#about" class="text-slate-500 hover:text-blue-600 transition">About</a>
                <a href="index.html#education" class="text-slate-500 hover:text-blue-600 transition">Education</a>
                <a href="index.html#research" class="text-slate-500 hover:text-blue-600 transition">Research</a>
                <a href="#" class="text-blue-600 font-bold">Publications</a>
                <a href="presentations.html" class="text-slate-500 hover:text-blue-600 transition">Presentations</a>
                <a href="index.html#cv" class="text-slate-500 hover:text-blue-600 transition">CV</a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-16 space-y-12">
        <!-- Header -->
        <header class="border-b border-slate-100 pb-8">
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight mb-4">Publications</h1>
            <p class="text-slate-500 text-sm">
                For a complete list or citation metrics, please visit my 
                <a href="https://scholar.google.com/citations?user=4ROFv34AAAAJ" target="_blank" class="text-blue-600 font-semibold hover:underline">Google Scholar</a> 
                or 
                <a href="https://www.researchgate.net/profile/Hyehyun-Ma" target="_blank" class="text-blue-600 font-semibold hover:underline">ResearchGate</a> profile.
            </p>
        </header>

        <!-- Publications Container (연도별로 JS가 자동 생성함) -->
        <div id="publications-container" class="space-y-12"></div>
    </main>

    <footer class="max-w-4xl mx-auto px-6 py-16 border-t border-slate-100 text-center">
        <p class="text-xs font-medium text-slate-400 tracking-wider">&copy; 2026 HYEHYUN MA. ALL RIGHTS RESERVED.</p>
    </footer>

    <script src="data.js"></script>
    <script>
        function renderPublications() {
            const container = document.getElementById('publications-container');
            if (!publicationData || publicationData.length === 0) return;

            // 1. 연도 내림차순 정렬
            const sortedData = [...publicationData].sort((a, b) => b.year - a.year);

            // 2. 연도 그룹핑
            const grouped = sortedData.reduce((acc, item) => {
                acc[item.year] = acc[item.year] || [];
                acc[item.year].push(item);
                return acc;
            }, {});

            // 3. HTML 생성
            const years = Object.keys(grouped).sort((a, b) => b - a);
            
            container.innerHTML = years.map(year => `
                <section class="space-y-6">
                    <h2 class="text-2xl font-bold text-slate-900 border-b border-slate-200 pb-2">${year}</h2>
                    <div class="space-y-6">
                        ${grouped[year].map(item => {
                            // 저자 이름 중 'Hye Hyun Ma', 'Ma, H. H.' 등을 볼드 처리하는 유틸리티
                            const highlightedAuthors = item.authors
                                .replace(/Hye Hyun Ma/g, '<strong class="text-slate-900 font-bold">Hye Hyun Ma</strong>')
                                .replace(/Ma, H\. H\./g, '<strong class="text-slate-900 font-bold">Ma, H. H.</strong>');

                            return `
                                <div class="space-y-1.5">
                                    <div class="flex flex-wrap items-center gap-2">
                                        ${item.type ? `<span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded tracking-wider uppercase">${item.type}</span>` : ''}
                                        ${item.award ? `<span class="text-[10px] font-bold text-amber-700 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded flex items-center gap-1">🏆 ${item.award}</span>` : ''}
                                    </div>
                                    <h3 class="text-base font-bold text-slate-900 leading-snug">
                                        <a href="${item.link || '#'}" target="_blank" class="hover:text-blue-600 transition inline-flex items-center gap-1">
                                            ${item.title}
                                            <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-400"></i>
                                        </a>
                                    </h3>
                                    <p class="text-xs text-slate-600 leading-relaxed">${highlightedAuthors}</p>
                                    <p class="text-xs text-slate-500 italic">${item.venue}</p>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </section>
            `).join('');
        }

        window.onload = renderPublications;
    </script>
</body>
</html>
